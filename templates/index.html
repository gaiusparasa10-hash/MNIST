<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST Digit Recognition</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Application Title & Description -->
        <h1>MNIST Digit Recognition</h1>
        <p class="description">Draw a digit from 0 to 9 and let the model predict it.</p>

        <!-- Interactive Canvas Card -->
        <div class="canvas-container">
            <!-- 280x280 Canvas (10x scaled up from 28x28 for smooth drawing) -->
            <canvas id="canvas" width="280" height="280"></canvas>
            
            <!-- Control Buttons -->
            <div class="button-group">
                <button id="predict-btn" class="btn btn-primary">Predict</button>
                <button id="clear-btn" class="btn btn-secondary">Clear</button>
            </div>
        </div>

        <!-- Result Display Section -->
        <div class="result-card">
            <div class="result-item">
                <span class="result-label">Prediction:</span>
                <span id="prediction-text" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Confidence:</span>
                <span id="confidence-text" class="result-value">-</span>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
